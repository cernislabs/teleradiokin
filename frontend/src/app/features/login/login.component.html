<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1 i18n="@@login.title">Teleradiokin</h1>
    <p class="subtitle" i18n="@@login.subtitle">Sign in to continue</p>

    <label i18n="@@login.email.label" for="email">Email</label>
    <input id="email" type="email" formControlName="email" autocomplete="username"
           placeholder="you@clinic.org" i18n-placeholder="@@login.email.placeholder" />

    <label i18n="@@login.password.label" for="password">Password</label>
    <input id="password" type="password" formControlName="password"
           autocomplete="current-password" />

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <button type="submit" [disabled]="form.invalid || submitting()">
      @if (submitting()) {
        <span i18n="@@login.submitting">Signing in…</span>
      } @else {
        <span i18n="@@login.submit">Sign in</span>
      }
    </button>
  </form>
</div>
